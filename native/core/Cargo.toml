[package]
name = "workspace-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "=1.0.104"
base64 = "=0.22.1"
hex = "0.4.3"
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "0.10.9"
tokio = { version = "=1.53.2", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
turso = { version = "=0.8.3", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
