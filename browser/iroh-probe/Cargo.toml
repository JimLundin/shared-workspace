[package]
name = "browser-iroh-probe"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "=0.1.7"
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
n0-future = "=0.3.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"

[profile.release]
opt-level = "s"
lto = "thin"
strip = "debuginfo"
