[package]
name = "browser-workspace-host"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "=1.0.104"
console_error_panic_hook = "=0.1.7"
futures-util = "=0.3.34"
hex = "=0.4.3"
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
js-sys = "=0.3.105"
n0-future = "=0.3.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
url = "=2.5.8"
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"

[profile.release]
opt-level = "s"
lto = "thin"
strip = "debuginfo"
