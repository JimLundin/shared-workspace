[project]
name = "miryoku"
version = "0.1.0"
requires-python = ">=3.10"

[tool.mypy]
python_version = "3.10"
strict = true
# No Any, anywhere: not written, not inferred, not hidden behind a decorator or import.
disallow_any_explicit = true
disallow_any_expr = true
disallow_any_decorated = true
disallow_any_unimported = true
warn_unreachable = true

[[tool.mypy.overrides]]
# The ctypes boundary. ctypes is untyped, so values here are Any until converted;
# every function's signature is concrete, so nothing untyped leaves this module.
module = "miryoku.win32"
disallow_any_expr = false

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py310"
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PL", "C4", "RET"]
ignore = ["PLR2004", "PLR0911", "PLR0912"]

[tool.ruff.lint.per-file-ignores]
# The layout tables are kept as a wide grid that reads across the keyboard.
"miryoku/layout.py" = ["E501"]
