[project]
name = "miryoku"
version = "0.1.0"
requires-python = ">=3.10"

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py310"
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PL", "C4", "RET"]
ignore = ["PLR2004", "PLR0911", "PLR0912"]

[tool.ruff.lint.per-file-ignores]
# The layout tables are kept as a wide grid that reads across the keyboard.
"miryoku/layout.py" = ["E501"]
