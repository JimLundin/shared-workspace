name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python selfcheck.py
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q
  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . mypy pyright ruff
      - run: mypy .
      - run: pyright
      - run: ruff check .
  bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/bundle.py dist/toolkit-sdk-python312-win64.zip
      - run: python -m zipfile -e dist/toolkit-sdk-python312-win64.zip dist/check
      - run: python dist/check/toolkit/selfcheck.py
      - uses: actions/upload-artifact@v4
        with:
          name: toolkit-sdk-python312-win64
          path: dist/toolkit-sdk-python312-win64.zip
