name: Browser workspace

on:
  push:
    paths:
      - 'browser/**'
      - 'native/core/src/model.rs'
      - 'native/core/Cargo.toml'
      - 'native/ui/**'
      - '.github/workflows/browser.yml'
  pull_request:
    paths:
      - 'browser/**'
      - 'native/core/src/model.rs'
      - 'native/core/Cargo.toml'
      - 'native/ui/**'
      - '.github/workflows/browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check and build the browser host
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      HOST_WASM_TARGET_DIR: ${{ github.workspace }}/browser/host-wasm/target
      CARGO_TARGET_DIR: ${{ github.workspace }}/browser/host-wasm/target
      CC_wasm32_unknown_unknown: clang-18
      AR_wasm32_unknown_unknown: llvm-ar-18
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            native/ui/package-lock.json
            browser/host/package-lock.json
            browser/app/package-lock.json
            browser/checks/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            browser/host-wasm/target
          key: browser-wasm-${{ runner.os }}-${{ hashFiles('browser/host-wasm/Cargo.lock') }}
          restore-keys: browser-wasm-${{ runner.os }}-
      - name: Install WebAssembly build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 llvm-18
          cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - name: Check the shared domain and WASM transport
        run: |
          cargo fmt --manifest-path browser/host-wasm/Cargo.toml -- --check
          cargo test --manifest-path browser/host-wasm/Cargo.toml --locked --lib
          RUSTFLAGS='--cfg getrandom_backend="wasm_js"' cargo clippy --manifest-path browser/host-wasm/Cargo.toml --locked --target wasm32-unknown-unknown -- -D warnings
          bash browser/host-wasm/build.sh
      - name: Install pinned web dependencies
        run: |
          npm --prefix native/ui ci --ignore-scripts
          npm --prefix browser/host ci --ignore-scripts
          npm --prefix browser/app ci --ignore-scripts
          npm --prefix browser/checks ci --ignore-scripts
          npm --prefix browser/checks exec -- playwright install --with-deps chromium webkit
      - name: Check interfaces and presentation behavior
        run: |
          npm --prefix browser/host run check
          npm --prefix browser/host test
          npm --prefix browser/checks run check
          npm --prefix native/ui run check
          npm --prefix native/ui test
          npm --prefix browser/app test
      - name: Verify automatic update discovery guards
        run: npm --prefix browser/app run test:update-mutations
      - name: Exercise voice and application interactions
        run: |
          npm --prefix native/ui run test:browser
          node browser/app/tests/provider-voice-capture.mjs
      - name: Detect credential and recording regressions
        run: |
          node browser/host/tests/mutate-connections.mjs --report browser/checks/evidence/ci-connection-mutations.json
          node browser/app/tests/provider-voice-mutations.mjs
          cp /tmp/provider-voice-mutation-evidence.json browser/checks/evidence/ci-provider-voice-mutations.json
          cp /tmp/provider-voice-capture-chromium-evidence.json browser/checks/evidence/ci-provider-voice-capture.json
      - name: Exercise real persistent browser peers
        run: node browser/checks/check.mjs --evidence browser/checks/evidence/ci-acceptance
      - name: Verify credential migration and workspace-scoped exchange
        run: |
          node browser/checks/connection-acceptance.mjs --case migration --evidence browser/checks/evidence/ci-connection-migration
          node browser/checks/connection-acceptance.mjs --case peers --evidence browser/checks/evidence/ci-connections
      - name: Exchange application and code revisions across browser engines
        run: node browser/checks/surface-acceptance.mjs --evidence browser/checks/evidence/ci-surfaces
      - name: Pair a visible Chromium inviter with WebKit
        run: node browser/checks/pairing-diagnose.mjs --laptop-engine chromium --phone-engine webkit --legacy-retry --exercise-sync --require-compact --evidence browser/checks/evidence/ci-webkit
      - name: Detect acknowledged work that was rolled back
        run: node browser/checks/mutate.mjs --baseline-report browser/checks/evidence/ci-acceptance/report.json --evidence browser/checks/evidence/ci-mutation
      - name: Detect invitation identity and scope corruption
        run: node browser/host/tests/mutate-invitation.mjs --report browser/checks/evidence/ci-invitation-mutations.json
      - name: Build and exercise the static website
        run: |
          npm --prefix browser/app run build
          npm --prefix browser/app run test:built
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ github.sha }}
          path: |
            browser/checks/evidence/**/*.json
            browser/app/evidence/**/*.json
          if-no-files-found: warn
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: browser/app/dist

  deploy:
    name: Publish the checked HTTPS application
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
